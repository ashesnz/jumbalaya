name: tests

on:
  push:
  pull_request:

jobs:
  love-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LÖVE
        run: |
          sudo apt-get update
          if sudo apt-get install -y love; then
            love --version
          else
            curl -fsSL -o love.AppImage https://github.com/love2d/love/releases/download/11.5/love-11.5-x86_64.AppImage
            chmod +x love.AppImage
            ./love.AppImage --appimage-extract
            sudo ln -sf "$PWD/squashfs-root/bin/love" /usr/local/bin/love || sudo ln -sf "$PWD/squashfs-root/love" /usr/local/bin/love
            love --version
          fi
      - name: Run headless suite
        run: love tests
