name: tests

on:
  push:
  pull_request:

jobs:
  love-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LÖVE
        run: |
          sudo apt-get update
          sudo apt-get install -y love
          love --version
      - name: Run headless suite
        run: love tests
